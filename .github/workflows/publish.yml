name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # trusted publishing: npm verifies the workflow via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify package
        run: |
          node scripts/build-registry.js --check
          node scripts/check-licenses.js
          node scripts/validate.js

      # No NPM_TOKEN. npm exchanges the GitHub OIDC token for a short-lived
      # publish credential. Requires a Trusted Publisher entry on npmjs.com:
      # package aidentity -> Settings -> Trusted Publishing -> GitHub
      # owner AkshatNaruka, repo aidentity, workflow publish.yml.
      - name: Publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi
